# dependabot.yml for puller
#
# Why this file exists (public repo, supply-chain defense):
# Every one of the 44 GitHub Actions cron jobs in this repo runs
# `pip install requests bs4` (or the nlp_requirements set) with NO version
# pinning. Whatever PyPI serves is what your cron jobs execute against
# production newsroom APIs. This enables Dependabot to (a) scan for
# released CVEs against the pinned `requirements.txt` files and (b) keep
# the `actions/*` versions current — both as PRs for review, not auto-merge.
#
# Public-repo note: Dependabot is a free feature, so there is no license cost.
#
# Not enabled here (your call, read the PR body before opting in):
#   - package-ecosystem: "pip" against inline `pip install` commands in the
#     .github/workflows/*.yaml files. Dependabot only sees what's in a
#     requirements*.txt it can find; the 44 workflows use inline installs by
#     design (per-file dep isolation). Enabling the ecosystem will produce a
#     large stream of "no lockfile found" PRs until you move the inlines into
#     pinned requirements files. If you want that, see PR body item (e).

version: 2
updates:
  # GitHub-hosted Actions (checkout, setup-python, cache). Daily, patch/minor only.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      # Time in UTC. Avoid peak hours (06:00 = 2 AM US East).
      time: "06:00"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"

  # Python packages in requirements files (requirements.txt, nlp_requirements.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "06:00"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
    # Do not auto-merge. A pinned version bump in a public repo should get a
    # human eyeball; a malicious release / typosquat should not slip in silent.
    open-pull-requests-limit: 5
    ignore:
      # Do not let Dependabot downgrade across major versions silently.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
