name: Trend Data Activation

on:
  workflow_dispatch:
  schedule:
    - cron: "10/10 * * * *" 

jobs:
  importer:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the Repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Cache Packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/trend_reqs.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests bs4
        env:
          PIP_CACHE_DIR: ~/.cache/pip

      - name: Run the Data
        env:
          MY_SECRET_JSON: ${{ secrets.MY_SECRET_JSON }}
          BACKEND_API: ${{ secrets.BACKEND_API }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_PW:  ${{ secrets.BLUESKY_PW }}
          UPI_WIRE:  ${{ secrets.UPI_WIRE }}
          SPORTS_WIRE:  ${{ secrets.SPORTS_WIRE }}
          HANDLE_ONE:  ${{ secrets.HANDLE_ONE }}
          HANDLE_TWO:  ${{ secrets.HANDLE_TWO }}
          BACKEND_API: ${{ secrets.BACKEND_API }}
          TREND_BACKEND: ${{ secrets.TREND_BACKEND }}
          TREND_BACKSET: ${{ secrets.TREND_BACKSET }}
        run: |
          python trend_data.py
