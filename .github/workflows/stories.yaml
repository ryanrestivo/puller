name: Run Importer

on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * *" # every day at 5:17 am GMT

permissions:
  contents: read

jobs:
  spacy_job:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout the Repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "**/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests; fi

      - name: Run Importer Script
        env:
          NEW_SECRET_JSON: ${{ secrets.NEW_SECRET_JSON }}
          BACKEND_API: ${{ secrets.BACKEND_API }}
          CMS_NAME: ${{ secrets.CMS_NAME }}
        run: python main.py